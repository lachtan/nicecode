# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

config:
  # --- Disabled rules ---

  # MD013/line-length: docs carry long descriptions, tables and URLs
  MD013: false
  # MD024/no-duplicate-heading: duplicate headings are fine among siblings
  # (repeated "Example", "Usage" and the like)
  MD024:
    siblings_only: true
  # MD029/ol-prefix: ordered lists use real numbers (1. 2. 3.), including lists
  # broken up by code blocks (the linter then sees them as separate lists)
  MD029: false
  # MD033/no-inline-html: the text contains C# generic types (<TLogType>),
  # HTML tables in NRT.md and other legitimate HTML
  MD033: false
  # MD040/fenced-code-language: for plain text (outputs, slash commands) a
  # language identifier adds nothing
  MD040: false
  # MD060/table-column-style: too strict about table formatting
  MD060: false

  # --- Enabled rules with configuration ---

  # MD004/ul-style: one bullet style - dash
  MD004:
    style: dash
  # MD010/no-hard-tabs: forbid hard tabs, but allow them inside code blocks
  MD010:
    code_blocks: false
  # MD046/code-block-style: fenced code blocks (```) instead of indented
  MD046:
    style: fenced
  # MD049/emphasis-style: one italic style
  MD049:
    style: asterisk
  # MD050/strong-style: one bold style
  MD050:
    style: asterisk

# Ignore directories that are not our documentation
ignorePatterns:
  - "node_modules"
  - "**/bin/**"
  - "**/obj/**"
  - ".git"
